# policy_path: "contact_policy_actuatorRand.pt"
# policy_path: "locomotion_go2/contact_policy_feetRandom.pt"
policy_path: "locomotion_go2/contact_policy_stanceSeperate.pt"
# policy_path: "locomotion_go2/contact_policy_latest.pt"
fixed_feet_positions: false
pcbo_plan_path: "/home/atari/workspace/DOOM/src/plans/go2_plan_pcbo_rank0.json"  # in-container path; set to null to restore heuristic stride
pcbo_stop_at_goal: false  # true = stop and hold at the knot closest to goal (safe); false = execute all knots
pcbo_initial_gait: "trot"  # gait schedule paired with file-backed PCBO contact locations on controller entry
control_dt: 0.005
decimation: 4
action_dim: 12
action_scale: 0.35
stiffness: 30.0
damping: 0.5
use_threading: False
use_buffer: False
device: "cuda:0"  
feet_step_size: 0.0
horizon_length: 15  # match PCBO plan sim_horizon (was 200 — caused 70s runs instead of 5.25s)
action_filter_alpha: 0.5
transition_duration: 0
visualize: 
  future_feet_positions: true
  current_contact_locations: true
  pcbo_goal: true
  feet_error: false
  contact_plan: false
  foot_forces: false
  contact_status: false


